<html lang="pt-BR">
<head>

<body>
<title>Painel ML Laser Brindes</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: barra fixa no topo com abas; cada aba é uma seção de trabalho com resumo antes do detalhe. */
:root{
  --bg:#f6f4ee; --surface:#ffffff; --surface2:#efece3; --line:#d9d4c5; --line2:#c6c0ad;
  --fg:#1d2230; --fg2:#525a6b; --fg3:#7d8494;
  --accent:#1f4e79; --accent-fg:#ffffff; --accent-soft:#e3ecf5;
  --ml:#e8c400; --ml-soft:#fff4bf;
  --good:#1e7a46; --good-soft:#dff3e6; --warn:#a4660a; --warn-soft:#fbeed2; --bad:#b3261e; --bad-soft:#fae1df; --info:#365f8a; --info-soft:#e3ecf5; --mute:#6b7280; --mute-soft:#ebe9e2;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --grid:#e1e0d9; --prev:#898781;
  --display:'Sora',system-ui,sans-serif; --body:'Nunito Sans',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(29,34,48,.06),0 4px 14px rgba(29,34,48,.05);
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15181f; --surface:#1d2129; --surface2:#262b35; --line:#343a47; --line2:#454c5c;
  --fg:#ecebe5; --fg2:#b5b9c4; --fg3:#858b99;
  --accent:#8fb6dc; --accent-fg:#101827; --accent-soft:#223449;
  --ml:#e8c400; --ml-soft:#4a4010;
  --good:#6fcf97; --good-soft:#1c3a2a; --warn:#e8b457; --warn-soft:#3f3015; --bad:#f28b82; --bad-soft:#44201e; --info:#8fb6dc; --info-soft:#223449; --mute:#9aa0ad; --mute-soft:#2c313b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#2c2c2a; --prev:#898781;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --grid:#2c2c2a; --prev:#898781;
  --bg:#15181f; --surface:#1d2129; --surface2:#262b35; --line:#343a47; --line2:#454c5c;
  --fg:#ecebe5; --fg2:#b5b9c4; --fg3:#858b99;
  --accent:#8fb6dc; --accent-fg:#101827; --accent-soft:#223449;
  --ml:#e8c400; --ml-soft:#4a4010;
  --good:#6fcf97; --good-soft:#1c3a2a; --warn:#e8b457; --warn-soft:#3f3015; --bad:#f28b82; --bad-soft:#44201e; --info:#8fb6dc; --info-soft:#223449; --mute:#9aa0ad; --mute-soft:#2c313b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.15rem;font-weight:600}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
h4{font-size:.9rem;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--fg3)}
.small{font-size:.85rem}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--ml);box-shadow:0 0 0 3px var(--ml-soft)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--fg2);background:var(--surface2);padding:3px 10px;border-radius:999px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.status.ok i{background:var(--good)} .status.local i{background:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 100%;scrollbar-width:none;margin-top:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--fg2);padding:7px 12px;border-radius:8px;font-weight:600;font-size:.9rem;white-space:nowrap}
nav.tabs a.on{background:var(--accent);color:var(--accent-fg)}
nav.tabs a .badge{margin-left:6px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}
section[data-view]{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);font-weight:700}
.tile .val{font-family:var(--display);font-size:1.4rem;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:.8rem;color:var(--fg2);margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--mute-soft);color:var(--mute);white-space:nowrap;line-height:1.4}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.ml{background:var(--ml-soft);color:var(--fg)}
.alert{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:6px;font-size:.9rem}
.alert.bad{border-color:var(--bad);background:var(--bad-soft)}
.alert.good{border-color:var(--good);background:var(--good-soft)}
.alert.info{border-color:var(--info);background:var(--info-soft)}
.alerts{display:grid;gap:8px}
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--fg3);font-weight:700;white-space:nowrap;background:var(--surface)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tr.open td{background:var(--accent-soft)}
tr.detail td{background:var(--surface2);padding:12px 14px}
.dwrap{position:sticky;left:0;width:min(calc(100vw - 66px),1206px);max-width:100%}
tr.pk td{color:var(--fg2);font-style:italic}
td .t{display:block;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .sku{font-weight:700}
.calc{display:grid;grid-template-columns:1fr auto;gap:3px 18px;max-width:560px;font-size:.9rem}
.calc .k{color:var(--fg2)} .calc .v{text-align:right;font-variant-numeric:tabular-nums}
.calc .sum{border-top:1px solid var(--line2);padding-top:4px;font-weight:700}
.calc .sum2{border-top:2px solid var(--fg);padding-top:5px;font-weight:700;font-size:1rem}
.calc .note{grid-column:1/-1;color:var(--fg3);font-size:.8rem}
.rules{display:grid;gap:6px;max-width:700px}
.rule{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;font-size:.9rem;padding:6px 8px;border-radius:6px;background:var(--surface)}
.rule .ic{font-weight:700;text-align:center}
.rule.ok .ic{color:var(--good)} .rule.no .ic{color:var(--bad)} .rule.na .ic{color:var(--mute)} .rule.warn .ic{color:var(--warn)}
.rule .m{font-variant-numeric:tabular-nums;color:var(--fg2);white-space:nowrap}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.form label{display:grid;gap:4px;font-size:.78rem;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;min-width:0}
.form .full{grid-column:1/-1}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);font-weight:400;text-transform:none;letter-spacing:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.filters label{display:grid;gap:3px;font-size:.72rem;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em}
.filters input,.filters select{padding:6px 8px;min-width:120px}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:28px 16px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}
.chart .bar:hover{fill:var(--ml)}
.chart text{fill:var(--fg2);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:fixed;z-index:20;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:.8rem;pointer-events:none;display:none;max-width:260px}
.how{max-width:72ch;font-size:.95rem;display:grid;gap:10px}
.how code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:.88em}
.how ol,.how ul{margin:0;padding-left:20px}
.empty{padding:28px;text-align:center;color:var(--fg2);border:1px dashed var(--line2);border-radius:var(--r)}
.meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
details summary{cursor:pointer;font-weight:700;color:var(--fg2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv b{color:var(--fg2);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-weight:600;display:none;max-width:90vw}
.inline-edit{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end;margin-top:10px}
.inline-edit label{display:grid;gap:3px;font-size:.72rem;font-weight:700;color:var(--fg3);text-transform:uppercase}
.sem{display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:1.02rem;text-decoration:none;color:var(--fg)}
.sem:hover{background:var(--surface2)}
.sem i{width:14px;height:14px;border-radius:50%;margin-top:5px;display:block;background:var(--mute)}
.sem.good i{background:var(--good)} .sem.warn i{background:var(--warn)} .sem.bad i{background:var(--bad)} .sem.info i{background:var(--info)}
.sem b{font-family:var(--display);font-weight:600}
.sem .sub{display:block;font-size:.85rem;color:var(--fg2);margin-top:2px}
.delta{font-size:.78rem;font-weight:700;white-space:nowrap} .delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--fg3)}
.topcard{display:grid;gap:3px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0}
.topcard .n{font-family:var(--display);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topcard .big{font-family:var(--display);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.topcard .act{font-size:.85rem;color:var(--fg2)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;margin-top:8px;color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart .grid{stroke:var(--grid)} .chart .axis{stroke:var(--line2)}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.cur{stroke:var(--s1)} .chart .ln.prev{stroke:var(--prev);stroke-dasharray:5 4}
.chart .lbl{font-weight:700;fill:var(--fg)}
body.apres nav.tabs,body.apres .noapres{display:none!important}
body.apres main{font-size:1.12rem}
body.apres .sem{font-size:1.22rem;padding:16px 18px}
body.apres .tile .val{font-size:1.9rem}
body.apres .topcard .big{font-size:1.5rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){ .tile .val{font-size:1.2rem} .calc{grid-template-columns:1fr auto} }
</style>

<script>
/*PARSER-START*/
const PT_MONTHS={janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
const PT_MON3={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
const MES_NOME=['','jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function norm(s){return String(s==null?'':s).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}
function toNum(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  let s=String(v).trim(); if(s==='-'||s===''||s==='—')return null;
  s=s.replace(/[R$\s%]/g,'');
  if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  const n=parseFloat(s);return isFinite(n)?n:null;
}
function pad(n){return String(n).padStart(2,'0');}
function isoDate(y,m,d){return y+'-'+pad(m)+'-'+pad(d);}
function parseDateAny(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){if(isNaN(v))return null;return isoDate(v.getFullYear(),v.getMonth()+1,v.getDate())+'T'+pad(v.getHours())+':'+pad(v.getMinutes());}
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400*1000));return isoDate(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())+'T'+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());}
  const s=norm(v);
  let m=s.match(/(\d{1,2}) de ([a-z]+) de (\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(m&&PT_MONTHS[m[2]])return isoDate(+m[3],PT_MONTHS[m[2]],+m[1])+(m[4]?'T'+pad(+m[4])+':'+m[5]:'');
  m=s.match(/(\d{1,2})-([a-z]{3})-(\d{4})/);
  if(m&&PT_MON3[m[2]])return isoDate(+m[3],PT_MON3[m[2]],+m[1]);
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(m)return isoDate(+m[3],+m[2],+m[1])+(m[4]?'T'+pad(+m[4])+':'+m[5]:'');
  m=s.match(/(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{2}):(\d{2}))?/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3]+(m[4]?'T'+m[4]+':'+m[5]:'');
  m=s.match(/^(\d{1,2}) ([a-z]+) (\d{4})$/);
  if(m&&PT_MONTHS[m[2]])return isoDate(+m[3],PT_MONTHS[m[2]],+m[1]);
  return null;
}
function parseMonth(v){ // "novembro 2026" -> "2026-11"
  const s=norm(v); const m=s.match(/^([a-z]+)(?: de)? (\d{4})$/); if(m&&PT_MONTHS[m[1]])return m[2]+'-'+pad(PT_MONTHS[m[1]]);
  const m2=s.match(/^(\d{2})\/(\d{4})$/); if(m2)return m2[2]+'-'+m2[1]; return null;
}
function findHeader(aoa,required){
  let best=-1,bestScore=0;
  for(let i=0;i<Math.min(aoa.length,30);i++){
    const cells=(aoa[i]||[]).map(norm);
    let score=0;for(const re of required)if(cells.some(c=>re.test(c)))score++;
    if(score>bestScore){bestScore=score;best=i;}
  }
  return bestScore>=2?best:-1;
}
const COLS_VENDAS={
  id:[/^n\W*o?\.?\s*de venda/,/^numero d[ae] venda/,/^id da venda/],
  dt:[/^data d[ae] venda/],
  st:[/^estado$/,/^status$/],
  un:[/^unidades/],
  rp:[/^receita por produtos/],
  ra:[/acrescimo no preco/],
  tp:[/taxa de parcelamento/],
  tv:[/^tarifa de venda/],
  re:[/^receita por envio/],
  te:[/^tarifas? de envio/],
  db:[/^descontos e bonus/,/^descontos$/],
  ca:[/^cancelamentos e reembolsos/],
  tot:[/^total \(/,/^total$/],
  mf:[/^mes de faturamento/],
  pub:[/^venda por publicidade/],
  sku:[/^sku$/],
  tit:[/^titulo do anuncio/],
  mlb:[/^# de anuncio/,/^codigo do anuncio/,/^n[^a-z]*do anuncio/,/^id do anuncio/],
  ent:[/^forma de entrega/],
  pu:[/^preco unitario/],
  vr:[/^variante/],
};

function adsVerdict(m,limite,cfg){

}

const Store={mode:'local',db:null,canWrite:true,ready:false,

    const ritmo=(v)=>v/diasPass*diasMes;const barra=(v,m,rot)=>{const pct=Math.min(100,m?v/m*100:0);const proj=ritmo(v);return `<div><div class="row between"><b>${rot}</b><span class="small">${fmtBRL(v)} de ${fmtBRL(m)} (${pct.toFixed(0)}%)</span></div><div class="meter" style="height:10px"><i style="width:${pct}%;background:${proj>=m?'var(--good)':proj>=m*0.85?'var(--warn)':'var(--bad)'}"></i></div><div class="small muted">No ritmo atual (${diasPass} de ${diasMes} dias) fecha em <b>${fmtBRL(proj)}</b>${P.parcial?'':' · mês encerrado'}</div></div>`;};

  else metaHtml=`<p class="small muted noapres">Defina a meta mensal de receita e lucro em <a href="#regras">Regras</a> para ver o ritmo do mês aqui.</p>`;

function weekStart(d){const t=new Date(Date.parse(d+'T00:00:00Z'));const w=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-w);return t.toISOString().slice(0,10);}
function chartSemanas(){
  const ws={};A.money.forEach(r=>{if(!r.d)return;const k=weekStart(r.d);const o=ws[k]||(ws[k]={k,tot:0,n:0});o.tot+=r.tot||0;o.n++;});
  const list=Object.values(ws).sort((a,b)=>a.k<b.k?-1:1).slice(-10);if(!list.length)return '';
  const W=560,H=220,pl=56,pr=12,pt=14,pb=34;const max=Math.max(...list.map(m=>m.tot))*1.1||1;const iw=(W-pl-pr)/list.length;const bw=Math.min(40,iw*0.62);
  let g='';for(let i=0;i<=4;i++){const v=max*i/4;const y=pt+(H-pt-pb)*(1-v/max);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0)}</text>`;}
  const last=list[list.length-1];
  const bars=list.map((m,i)=>{const h=(H-pt-pb)*m.tot/max;const x=pl+i*iw+(iw-bw)/2;const y=H-pb-h;const lab=m.k.slice(8,10)+'/'+m.k.slice(5,7);return `<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" data-tip="Semana de ${fmtD(m.k)} a ${fmtD(addDays(m.k,6))}: ${fmtBRL(m.tot)} em ${m.n} vendas"/>${m===last?`<text class="lbl" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${(m.tot/1000).toFixed(1)}k</text>`:''}<text x="${x+bw/2}" y="${H-pb+16}" text-anchor="middle">${lab}</text>`;}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Total ML por semana">${g}<line class="axis" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>${bars}</svg><p class="small muted">Semanas começam na segunda. A última pode estar incompleta.</p>`;
}
function chartAcumulado(P){
  const cur=P.cur,prev=P.prevFull;const nd=Math.max(monthEnd(P.ym),monthEnd(P.prevYm));
  const acc=(s,n)=>{let a=0;const out=[];for(let d=1;d<=n;d++){a+=s.porDia[d]||0;out.push(a);}return out;};
  const ac=acc(cur,P.parcial?P.day:monthEnd(P.ym)),ap=acc(prev,monthEnd(P.prevYm));
  const all=ac.concat(ap);const max=Math.max(...all,1),min=Math.min(...all,0);
  const W=560,H=220,pl=56,pr=48,pt=14,pb=30;const sx=d=>pl+(d-1)/(nd-1)*(W-pl-pr);const sy=v=>pt+(H-pt-pb)*(1-(v-min)/(max-min||1));
  let g='';for(let i=0;i<=4;i++){const v=min+(max-min)*i/4;const y=sy(v);g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0)}</text>`;}
  const path=arr=>arr.map((v,i)=>(i?'L':'M')+sx(i+1).toFixed(1)+' '+sy(v).toFixed(1)).join(' ');
  const xt=[1,5,10,15,20,25,nd].map(d=>`<text x="${sx(d)}" y="${H-pb+16}" text-anchor="middle">${d}</text>`).join('');
  const endC=ac.length?`<circle cx="${sx(ac.length)}" cy="${sy(ac[ac.length-1])}" r="4" fill="var(--s1)"/><text class="lbl" x="${sx(ac.length)+7}" y="${sy(ac[ac.length-1])+4}">${(ac[ac.length-1]/1000).toFixed(1)}k</text>`:'';
  const endP=ap.length&&prev.n?`<text x="${sx(ap.length)+7}" y="${sy(ap[ap.length-1])+4}" fill="var(--prev)">${(ap[ap.length-1]/1000).toFixed(1)}k</text>`:'';
  const pts=ac.map((v,i)=>`<rect x="${sx(i+1)-6}" y="${pt}" width="12" height="${H-pt-pb}" fill="transparent" data-tip="Dia ${i+1}: ${fmtBRL(v)} acumulado em ${fmtYM(P.ym)}${ap[i]!=null&&prev.n?' · '+fmtBRL(ap[i])+' em '+fmtYM(P.prevYm):''}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lucro acumulado no mês">${g}<line class="axis" x1="${pl}" x2="${W-pr}" y1="${sy(0)}" y2="${sy(0)}"/>${xt}${prev.n?`<path class="ln prev" d="${path(ap)}"/>`:''}<path class="ln cur" d="${path(ac)}"/>${endC}${endP}${pts}</svg>
  <div class="legend"><span><i style="background:var(--s1)"></i>${fmtYM(P.ym)}</span><span><i style="background:var(--prev)"></i>${fmtYM(P.prevYm)}${prev.n?'':' (sem dados)'}</span><span class="muted">lucro por venda somado dia a dia</span></div>`;
}
function chartComposicao(c){
  if(!c.rp)return '<p class="muted">Sem vendas no período.</p>';
  const segs=[{n:'Mercado Livre (tarifas, frete, reembolsos)',v:c.ml,col:'var(--s1)'},{n:'Produto e embalagem',v:c.custoProd+c.emb,col:'var(--s2)'},{n:'Lucro',v:Math.max(0,c.lucro),col:'var(--s3)'},{n:'Outros gastos',v:c.gastos-c.gastosAds,col:'var(--s4)'},{n:'Ads',v:c.gastosAds,col:'var(--s5)'}];
  const total=segs.reduce((a,s)=>a+Math.max(0,s.v),0)||1;const W=800,H=64;let x=0;
  const rects=segs.map(s=>{const w=Math.max(0,s.v)/total*W;const r=`<rect x="${x+1}" y="8" width="${Math.max(0,w-2)}" height="44" rx="3" fill="${s.col}" data-tip="${esc(s.n)}: ${fmtBRL(s.v)} (${(s.v/c.rp*100).toFixed(0)}%)"/>${w>60?`<text x="${x+w/2}" y="35" text-anchor="middle" fill="#fff" font-weight="700" style="font-size:13px">R$ ${(s.v/c.rp*100).toFixed(0)}</text>`:''}`;x+=w;return r;}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Composição de cada R$ 100 vendidos">${rects}</svg>
  <div class="legend">${segs.map(s=>`<span><i style="background:${s.col}"></i>${esc(s.n)}: <b>R$ ${(s.v/c.rp*100).toFixed(0)}</b></span>`).join('')}</div>
  ${c.lucro<0?`<p class="small" style="color:var(--bad);margin-top:6px">Prejuízo no período: ${fmtBRL(c.lucro)}. Os custos passam de R$ 100.</p>`:''}
  <p class="small muted" style="margin-top:6px">De cada R$ 100 que o cliente paga, quanto fica com o ML, quanto é produto, quanto vai para Ads e outros gastos, e quanto sobra. Ads e outros gastos vêm da aba Gastos, rateados pelos dias do período.</p>`;
}

function chartMes(){

function diffVendas(rows){
  const d={novas:0,atualizadas:0,canceladas:0,reembolsos:0,deltaTot:0};
  rows.forEach(r=>{const old=state.vendas[r.id];if(!old){d.novas++;return;}const ca=(old.ca||0)!==(r.ca||0);if(old.st!==r.st||(old.tot||0)!==(r.tot||0)||ca)d.atualizadas++;if(!isCancel(old.st)&&isCancel(r.st))d.canceladas++;if(ca)d.reembolsos++;d.deltaTot+=(r.tot||0)-(old.tot||0);});
  return d;
}
function diffTxt(d){if(!d)return '';return `${d.novas} novas · ${d.atualizadas} atualizadas (${d.canceladas} viraram cancelada/devolvida, ${d.reembolsos} com reembolso) · Total ML ${d.deltaTot>=0?'+':''}${fmtBRL(d.deltaTot)}`;}
function renderPending(){
  if(!ui.pending.length)return '';
  return ui.pending.map((p,i)=>{
    if(p.erro)return `<div class="alert bad" style="margin-top:12px"><b>${esc(p.nome)}</b>: ${esc(p.erro)}</div>`;
    const parts=p.parts.map((pt,j)=>{
      if(pt.tipo==='vendas'){const d=diffVendas(pt.rows);const ds=pt.rows.map(r=>(r.dt||'').slice(0,10)).filter(Boolean).sort();
        return `<div class="kv"><b>Tipo</b><span>Vendas (aba “${esc(pt.sheet)}”)</span><b>Linhas</b><span>${pt.rows.length} · ${pt.rows.length-d.novas} já existem</span><b>O que muda</b><span>${diffTxt(d)}</span><b>Período</b><span>${fmtD(ds[0])} a ${fmtD(ds[ds.length-1])}</span></div>`;}
      const inv=pt.rows.reduce((a,r)=>a+r.inv,0);const de=pt.rows.map(r=>r.de).filter(Boolean).sort()[0],ate=pt.rows.map(r=>r.ate).filter(Boolean).sort().pop();
      const dupAds=A.custos.filter(c=>c.tipo==='Ads'&&c.ini&&c.fim&&de&&ate&&overlapDays(c.ini,c.fim,de,ate)>0);
      return `<div class="kv"><b>Tipo</b><span>Ads (aba “${esc(pt.sheet)}”)</span><b>Linhas</b><span>${pt.rows.length} anúncios/campanhas</span><b>Período</b><span>${fmtD(de)} a ${fmtD(ate)}</span><b>Investimento</b><span>${fmtBRL(inv)}</span></div>
        <label class="row small" style="margin-top:8px;font-weight:600"><input type="checkbox" id="regads-${i}-${j}" ${dupAds.length?'':'checked'}> Registrar ${fmtBRL(inv)} como gasto de Ads (${fmtD(de)} a ${fmtD(ate)})</label>
        ${dupAds.length?`<div class="alert" style="margin-top:6px"><b>Atenção: já existe gasto de Ads nesse período</b> (${dupAds.map(c=>esc(c.desc||'Ads')+' '+fmtBRL(+c.valor)+' · '+fmtD(c.ini)+' a '+fmtD(c.fim)).join('; ')}). Marque a caixa só se for um gasto diferente.</div>`:''}`;
    }).join('<hr style="border:0;border-top:1px solid var(--line);margin:10px 0">');
    return `<div class="card flat" style="margin-top:12px;background:var(--surface2)"><div class="row between"><h3>${esc(p.nome)}</h3><div class="row"><button class="btn primary" data-act="commit" data-i="${i}" ${Store.canWrite?'':'disabled'}>Adicionar ao painel</button><button class="btn" data-act="discard" data-i="${i}">Descartar</button></div></div>${parts||'<p class="muted">Não reconheci nenhuma aba de vendas ou Ads neste arquivo.</p>'}</div>`;
  }).join('');
}
async function handleFiles(files){
  for(const f of files){
    try{
      if(/\.json$/i.test(f.name)){continue;}
      const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});
      const impId=uid('i');const parts=parseWorkbook(wb,impId);
      ui.pending.push({nome:f.name,impId,parts,erro:parts.length?null:'Não encontrei colunas de Vendas (N.º de venda, Total…) nem de Ads (Impressões, Investimento…) neste arquivo.'});
    }catch(e){console.error(e);ui.pending.push({nome:f.name,erro:'Não consegui ler o arquivo: '+(e.message||e)});}
  }
  render();
}
async function commitPending(i){
  const p=ui.pending[i];if(!p||p.erro)return;
  const btns=document.querySelectorAll('[data-act=commit]');btns.forEach(b=>{b.disabled=true;b.textContent='Salvando…';});
  try{
    for(let j=0;j<p.parts.length;j++){const pt=p.parts[j];
      if(pt.tipo==='vendas'){
        const diff=diffVendas(pt.rows);
        const m=Object.assign({},state.vendas);pt.rows.forEach(r=>{const old=m[r.id];m[r.id]=old?Object.assign({},old,r,{imp:old.imp||r.imp}):r;});
        await Store.writeRows('vendas',m);
        const ds=pt.rows.map(r=>(r.dt||'').slice(0,10)).filter(Boolean).sort();
        await Store.put('imports',p.impId+'v'+j,{nome:p.nome,tipo:'vendas',n:pt.rows.length,de:ds[0]||null,ate:ds[ds.length-1]||null,em:new Date().toISOString().slice(0,16),diff});
      }else{
        const m=Object.assign({},state.ads);pt.rows.forEach(r=>{m[r.key]=r;});
        await Store.writeRows('ads',m);
        const de=pt.rows.map(r=>r.de).filter(Boolean).sort()[0]||null,ate=pt.rows.map(r=>r.ate).filter(Boolean).sort().pop()||null;
        await Store.put('imports',p.impId+'a'+j,{nome:p.nome,tipo:'ads',n:pt.rows.length,de,ate,em:new Date().toISOString().slice(0,16)});
        const cb=document.getElementById(`regads-${i}-${j}`);
        if(cb&&cb.checked){const inv=pt.rows.reduce((a,r)=>a+r.inv,0);const id=uid('c');await Store.put('custos',id,{tipo:'Ads',desc:'Ads – relatório '+p.nome.replace(/\.(xlsx|xls|csv)$/i,''),valor:+inv.toFixed(2),ini:de,fim:ate,obs:'Registrado automaticamente na importação',imp:p.impId});}
      }
    }
    ui.pending.splice(i,1);toast('Importado com sucesso');
  }catch(e){console.error(e);}
  render();
}
async function removeImport(id){
  const imp=state.imports[id];if(!imp)return;const base=id.replace(/[va]\d+$/,'');
  if(imp.tipo==='vendas'){const m={};Object.values(state.vendas).forEach(r=>{if(r.imp!==base)m[r.id]=r;});await Store.writeRows('vendas',m);}
  else{const m={};Object.values(state.ads).forEach(r=>{if(r.imp_id!==base)m[r.key]=r;});await Store.writeRows('ads',m);}
  await Store.del('imports',id);toast('Importação removida');render();
}

    <td class="small">${c.flags.map(f=>`<span class="badge bad">✕ repetido?</span> ${esc(f.msg)} com “${esc(f.com.desc||f.com.tipo)}” (${fmtBRL(+f.com.valor)})`).join('<br>')}</td>
    <td class="row"><button class="btn sm" data-act="edit-custo" data-id="${c.id}">Editar</button><button class="btn sm danger" data-act="del-custo" data-id="${c.id}" ${Store.canWrite?'':'disabled'}>Excluir</button></td></tr>`;}).join('')}

function liveDup(){
  const el=document.getElementById('dup-live');if(!el)return;
  const c={tipo:document.getElementById('c-tipo').value,desc:document.getElementById('c-desc').value,valor:+document.getElementById('c-valor').value||0,ini:document.getElementById('c-ini').value,fim:document.getElementById('c-fim').value};
  const e=ui.editCusto||{};const hits=[];
  A.custos.forEach(o=>{if(o.id===e.id||o.tipo!==c.tipo)return;const ov=(o.ini&&o.fim&&c.ini&&c.fim)?overlapDays(o.ini,o.fim,c.ini,c.fim)>0:(!o.ini&&!c.ini);
    if(Math.abs((+o.valor||0)-c.valor)<0.011&&ov&&c.valor)hits.push(['mesmo valor e período sobreposto',o]);
    else if(norm(c.desc)&&norm(c.desc)===norm(o.desc)&&ov)hits.push(['mesma descrição e período sobreposto',o]);
    else if(c.tipo==='Ads'&&ov&&c.ini)hits.push(['já existe gasto de Ads nesse período',o]);});
  el.innerHTML=hits.length?`<div class="alert bad"><b>Parece repetido:</b> ${hits.map(([m,o])=>esc(m)+' com “'+esc(o.desc||o.tipo)+'” ('+fmtBRL(+o.valor)+(o.ini?', '+fmtD(o.ini)+' a '+fmtD(o.fim):'')+')').join('; ')}. Se for mesmo outro gasto, pode salvar.</div>`:'';
}

    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="save-cfg" ${Store.canWrite?'':'disabled'}>Salvar regras</button><button class="btn" data-act="reset-cfg">Voltar ao padrão</button></div>
  </div>

function howCard(){return `<div class="card"><h3>Como o painel calcula</h3><div class="how">
  <p><b>1. Cada venda</b> segue a conta do próprio Mercado Livre: <code>receita por produtos + acréscimo − taxa de parcelamento − tarifa de venda + receita por envio − tarifas de envio + descontos e bônus − cancelamentos = Total ML</code>. Esse Total é o que cai na sua conta.</p>
  <p><b>2. Lucro da venda</b> = Total ML − custo do produto (custo unitário × unidades) − embalagem − Ads atribuído − rateio de gastos fixos. O Ads atribuído vale só para vendas marcadas “Venda por publicidade: Sim”: investimento do anúncio no relatório ÷ nº de vendas por publicidade daquele SKU. Gastos fixos (seguidores, etc.) com início e fim são divididos igualmente entre as vendas válidas do período.</p>
  <p><b>3. Pacotes</b> (“Pacote de N produtos”): o ML põe o dinheiro só na linha do pacote. O painel divide entre os produtos pelo preço médio de cada SKU × unidades, e marca como “rateado”.</p>
  <p><b>4. Reimportar</b> o mesmo período não duplica: a venda é identificada pelo nº e só é atualizada (estado, reembolsos). No Ads, a chave é anúncio + campanha + período.</p>
  <p><b>5. Ads compensa?</b> Limite de ACOS do SKU = (Total ML − custo − embalagem) ÷ receita, ou seja, quanto da receita sobra para pagar anúncio. Se o ACOS do relatório (investimento ÷ receita do Ads) passa do limite, o anúncio dá prejuízo em cada venda que gera: <b>não compensa</b>. Entre ${A.cfg.adsFolga}% e 100% do limite: <b>no limite</b>. Abaixo: <b>compensa</b>. “Fraco” é o anúncio que aparece e não recebe clique (CTR baixo) ou recebe clique e não vende (CVR baixo); aí o problema é foto, título, preço ou frete, não o orçamento. Com menos de ${A.cfg.adsMinImpressoes} impressões o painel não julga.</p>
  <p><b>6. Vale enviar ao Full?</b> Precisa girar (≥ ${A.cfg.fullMinUnidades30} unidades em 30 dias), ter margem líquida ≥ ${A.cfg.fullMinMargem}%, poucos cancelamentos (≤ ${A.cfg.fullMaxCancel}%) e histórico mínimo. Giro é o que paga a armazenagem; margem é o que sobra depois dela. A tendência e o preço (frete grátis a partir de R$ ${A.cfg.fullPrecoFreteGratis}) são informativos. Se você tem SKU com e sem Full do mesmo produto, a aba Full mostra os dois lado a lado.</p>
  <p><b>7. Gasto repetido:</b> ao salvar ou importar, o painel compara tipo, valor, descrição e período e avisa antes de contar duas vezes.</p>
  <p><b>8. Fechamentos:</b> igual à sua planilha. Soma o Total ML pela data de liberação (coluna “Mês de faturamento” quando vem como data), em períodos 01–07, 08–14, 15–21 e 22–fim. Os gastos entram rateados por dia. Você registra o que já recebeu e o painel mostra o que falta.</p>
  <p><b>9. Folha impressa:</b> custo por cm² = filme A por cm² (preço do rolo ÷ largura × comprimento) + filme B por cm² + cada tinta por cm² (preço ÷ ml do frasco × ml gastos por m² ÷ 10.000) + outros insumos por m² ÷ 10.000, tudo × (1 + perda %). Custo da folha = cm² da folha × custo por cm². Custo por metro linear = largura do rolo × 100 × custo por cm².</p>
  <p><b>10. Rateio mensal:</b> cada custo do mês é dividido entre as unidades que entram na divisão: em partes iguais, por percentual que você define, ou com valor direto por unidade. O total da unidade ÷ (dias do mês ÷ 7) dá o custo por semana; ÷ folhas impressas no mês dá o custo fixo por folha. O botão “Lançar em Gastos” leva a parte da unidade para a aba Gastos como custo fixo do mês, e o alerta de repetição avisa se lançar duas vezes.</p>
</div></div>`;}

const DEFAULT_FOLHA={
  filmeA:{nome:'Filme A (impressão)',modo:'rolo',preco:0,larguraCm:30,comprimentoCm:10000,qtd:0,l:29,a:42},
  filmeB:{nome:'Filme B (laminação)',ativo:true,modo:'rolo',preco:0,larguraCm:30,comprimentoCm:10000,qtd:0,l:29,a:42},
  tintas:[{nome:'Tinta colorida (CMYK)',preco:0,ml:1000,consumo:10},{nome:'Tinta branca',preco:0,ml:1000,consumo:8},{nome:'Verniz',preco:0,ml:1000,consumo:6}],
  outros:[],perdaPct:5,
  tamanhos:[{nome:'29 × 21',l:29,a:21},{nome:'29 × 42',l:29,a:42},{nome:'29 × 50',l:29,a:50},{nome:'29 × 100',l:29,a:100},{nome:'40 × 72',l:40,a:72}],
  custom:{l:29,a:30},peca:{l:5,a:5,folha:1},
};
function folhaCfg(){if(!ui.folhaDraft){const s=state.folha&&state.folha.filmeA?state.folha:DEFAULT_FOLHA;ui.folhaDraft=JSON.parse(JSON.stringify(s));}return ui.folhaDraft;}
function filmeCm2(f){if(!f||!+f.preco)return 0;if(f.modo==='folhas'){const area=(+f.qtd||0)*(+f.l||0)*(+f.a||0);return area?+f.preco/area:0;}const area=(+f.larguraCm||0)*(+f.comprimentoCm||0);return area?+f.preco/area:0;}
function calcFolha(c){
  const linhas=[];
  linhas.push({nome:c.filmeA.nome||'Filme A',cm2:filmeCm2(c.filmeA),det:c.filmeA.modo==='folhas'?`${fmtBRL(+c.filmeA.preco)} ÷ (${c.filmeA.qtd} folhas × ${c.filmeA.l} × ${c.filmeA.a} cm)`:`${fmtBRL(+c.filmeA.preco)} ÷ (${c.filmeA.larguraCm} × ${c.filmeA.comprimentoCm} cm)`});
  if(c.filmeB&&c.filmeB.ativo)linhas.push({nome:c.filmeB.nome||'Filme B',cm2:filmeCm2(c.filmeB),det:c.filmeB.modo==='folhas'?`${fmtBRL(+c.filmeB.preco)} ÷ (${c.filmeB.qtd} folhas × ${c.filmeB.l} × ${c.filmeB.a} cm)`:`${fmtBRL(+c.filmeB.preco)} ÷ (${c.filmeB.larguraCm} × ${c.filmeB.comprimentoCm} cm)`});
  (c.tintas||[]).forEach(t=>{const cm2=+t.preco&&+t.ml?(+t.preco/+t.ml)*(+t.consumo||0)/10000:0;linhas.push({nome:t.nome,cm2,det:`${fmtBRL(+t.preco)} ÷ ${t.ml} ml × ${t.consumo} ml/m² ÷ 10.000`});});
  (c.outros||[]).forEach(o=>linhas.push({nome:o.nome,cm2:(+o.valor||0)/10000,det:`${fmtBRL(+o.valor)} por m² ÷ 10.000`}));
  const base=linhas.reduce((a,l)=>a+l.cm2,0);const perda=+c.perdaPct||0;const total=base*(1+perda/100);
  return{linhas,base,perda,total};
}
function pecasPorFolha(L,A,l,a){if(!l||!a)return 0;return Math.max(Math.floor(L/l)*Math.floor(A/a),Math.floor(L/a)*Math.floor(A/l));}
const fmtCm2=n=>'R$ '+(n||0).toLocaleString('pt-BR',{minimumFractionDigits:5,maximumFractionDigits:5});
function vFolha(){

        <span class="k">× (1 + ${R.perda}% de perda)</span><span class="v"></span>
        <span class="k sum2">= Custo por cm² impresso</span><span class="v sum2">${fmtCm2(R.total)}</span>
        <span class="k">Custo por m²</span><span class="v">${fmtBRL(R.total*10000)}</span>
        <span class="k">Custo por metro linear do rolo (${c.filmeA.larguraCm||0} cm de largura)</span><span class="v">${fmtBRL(R.total*(+c.filmeA.larguraCm||0)*100)}</span>
        <span class="k">Custo por cm de rolo</span><span class="v">${fmtBRL(R.total*(+c.filmeA.larguraCm||0))}</span>
        ${R.total?'':'<span class="note">Preencha os valores pagos à esquerda para o custo aparecer.</span>'}
      </div></div>
      <div class="card"><h3>Custo por tamanho de folha</h3>
        <div class="tbl-wrap"><table><thead><tr><th>Folha</th><th class="r">cm²</th><th class="r">Custo da folha</th><th class="r">Peças ${c.peca.l}×${c.peca.a}</th><th class="r">R$/peça</th><th></th></tr></thead><tbody>
        ${c.tamanhos.map((t,i)=>{const area=(+t.l||0)*(+t.a||0);const n=pecasPorFolha(+t.l,+t.a,+c.peca.l,+c.peca.a);return `<tr><td style="white-space:nowrap"><input type="text" data-f="tamanhos.${i}.nome" value="${esc(t.nome)}" style="width:100px;padding:4px 6px"> <input type="number" step="0.1" data-f="tamanhos.${i}.l" value="${t.l}" style="width:60px;padding:4px 6px"> × <input type="number" step="0.1" data-f="tamanhos.${i}.a" value="${t.a}" style="width:60px;padding:4px 6px"> cm</td><td class="r">${fmtN(area)}</td><td class="r"><b>${fmtBRL(area*R.total)}</b></td><td class="r">${n}</td><td class="r">${n?fmtBRL(area*R.total/n):'—'}</td><td><button class="btn sm danger" data-act="rm-folha" data-list="tamanhos" data-i="${i}">×</button></td></tr>`;}).join('')}

        </tbody></table></div>

function folhaOverhead(){
  const r=state.rateio&&state.rateio.unidades?state.rateio:null;if(!r)return '';
  const linhas=[];Object.keys(r.meses||{}).sort().reverse().slice(0,3).forEach(ym=>{const R=calcRateio(r,ym);if(!R)return;r.unidades.forEach(u=>{const f=+((r.meses[ym].folhas||{})[u.id])||0;if(f>0)linhas.push({ym,u,f,v:R.tot[u.id]/f});});});
  if(!linhas.length)return `<div class="card flat"><h4>Custo fixo por folha</h4><p class="small muted" style="margin-top:4px">Na aba <a href="#rateio">Rateio mensal</a>, informe quantas folhas a unidade imprimiu no mês para ver aqui quanto de energia, imposto e outros custos cabe em cada folha.</p></div>`;
  return `<div class="card flat"><h4>Custo fixo por folha (do rateio mensal)</h4><div class="calc" style="margin-top:6px">${linhas.map(l=>`<span class="k">${esc(l.u.nome)} · ${fmtYM(l.ym)} (${fmtN(l.f)} folhas)</span><span class="v">${fmtBRL(l.v)} por folha</span>`).join('')}<span class="note">Some ao custo do material da folha para ter o custo completo.</span></div></div>`;
}

// ----- Rateio mensal -----
const DEFAULT_RATEIO={unidades:[{id:'u1',nome:'Canecas',ativa:true},{id:'u2',nome:'DTF UV',ativa:true},{id:'u3',nome:'Tráfego pago / WhatsApp',ativa:false}],meses:{}};
const ITENS_PADRAO=[['Energia','igual'],['Imposto','igual'],['Ads Mercado Livre','direto'],['Internet e sistemas','igual'],['Aluguel','igual'],['Outros','igual']];
function rateioCfg(){if(!ui.rateioDraft){const s=state.rateio&&state.rateio.unidades?state.rateio:DEFAULT_RATEIO;ui.rateioDraft=JSON.parse(JSON.stringify(s));if(!ui.rateioDraft.meses)ui.rateioDraft.meses={};}return ui.rateioDraft;}
function calcRateio(r,ym){
  const mes=(r.meses||{})[ym];if(!mes)return null;const us=r.unidades||[];const ativas=us.filter(u=>u.ativa);
  const tot={};us.forEach(u=>tot[u.id]=0);let geral=0,naoAlocado=0;const detalhe=[];
  (mes.itens||[]).forEach(it=>{const sh={};let v=+it.valor||0;
    if(it.modo==='igual'){ativas.forEach(u=>sh[u.id]=ativas.length?v/ativas.length:0);}
    else if(it.modo==='pct'){us.forEach(u=>{const p=+((it.pct||{})[u.id])||0;if(p)sh[u.id]=v*p/100;});}
    else{v=0;us.forEach(u=>{const x=+((it.direto||{})[u.id])||0;if(x){sh[u.id]=x;v+=x;}});}
    const alocado=Object.values(sh).reduce((a,b)=>a+b,0);geral+=v;naoAlocado+=v-alocado;us.forEach(u=>tot[u.id]+=sh[u.id]||0);detalhe.push({it,sh,v,alocado});});
  // material do mês (filme e tinta), com preços da aba Folha impressa

  // manter foco em campos de filtro após re-render
  if(ui._focus){const f=app.querySelector(ui._focus);if(f&&f!==document.activeElement){if(ui._focusVal!=null&&(f.type==='text'||f.type==='number'||f.type==='search'))f.value=ui._focusVal;f.focus();try{f.setSelectionRange(f.value.length,f.value.length);}catch(e){}}}
  app.addEventListener('focusin',e=>{const t=e.target;ui._focus=t.id?'#'+CSS.escape(t.id):t.dataset.f?'[data-f="'+t.dataset.f+'"]':t.dataset.r?'[data-r="'+t.dataset.r+'"]':null;ui._focusVal=null;});
  app.addEventListener('focusout',()=>{ui._focusVal=null;});
}
let _deb;function debounce(fn){clearTimeout(_deb);_deb=setTimeout(fn,250);}
async function backup(){
  const data={v:1,em:new Date().toISOString(),config:state.config,mapeamento:state.mapeamento,fechamentos:state.fechamentos,folha:state.folha,rateio:state.rateio,custos:state.custos,produtos:state.produtos,imports:state.imports,vendas:Object.values(state.vendas),ads:Object.values(state.ads)};
  const json=JSON.stringify(data);
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:'painel-ml-backup-'+new Date().toISOString().slice(0,10)+'.json',data:json});toast('Backup gerado');}catch(e){toast('Download não concluído');}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='painel-ml-backup.json';a.click();}
}
async function restore(file){
  if(!file)return;try{const d=JSON.parse(await file.text());
    const v={},a={};(d.vendas||[]).forEach(r=>v[r.id]=r);(d.ads||[]).forEach(r=>a[r.key]=r);
    await Store.writeRows('vendas',v);await Store.writeRows('ads',a);
    await Store.put('config','geral',d.config||{});await Store.put('config','mapeamento',d.mapeamento||{});await Store.put('config','fechamentos',d.fechamentos||{});await Store.put('config','folha',d.folha||{});await Store.put('config','rateio',d.rateio||{});
    for(const id in state.custos)await Store.del('custos',id);for(const id in d.custos||{}){const x=Object.assign({},d.custos[id]);delete x.id;await Store.put('custos',id,x);}
    for(const id in state.produtos)await Store.del('produtos',id);for(const id in d.produtos||{}){const x=Object.assign({},d.produtos[id]);delete x.id;await Store.put('produtos',id,x);}
    for(const id in state.imports)await Store.del('imports',id);for(const id in d.imports||{}){const x=Object.assign({},d.imports[id]);delete x.id;await Store.put('imports',id,x);}
    toast('Backup restaurado');render();
  }catch(e){console.error(e);toast('Não consegui restaurar: '+(e.message||e));}
}
async function wipeAll(){
  await Store.writeRows('vendas',{});await Store.writeRows('ads',{});
  for(const id in state.custos)await Store.del('custos',id);for(const id in state.produtos)await Store.del('produtos',id);for(const id in state.imports)await Store.del('imports',id);
  await Store.put('config','mapeamento',{});await Store.put('config','fechamentos',{});
  toast('Tudo apagado');render();
}
